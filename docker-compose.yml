services:
  cm-notify:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cm-notify
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - CHAT_ID=${CHAT_ID}
      - THREAD_ID=${THREAD_ID}
      - PORT=${PORT:-8080}
    env_file:
      - .env
    networks:
      - cm-notify-network

networks:
  cm-notify-network:
    driver: bridge
